name: Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find project
        run: |
          ls -la
          find . -name gradlew

      - name: Build APK
        run: |
          chmod +x $(find . -name gradlew | head -1)
          $(find . -name gradlew | head -1) assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PriceFinderAI-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
